; Réglages PHP de SuiviTestIntrusion (socle-2), appliqués après php.ini-production.

; Taille d'un envoi : 100 Mio de fichier chiffré au plus (GED_MAX_FILE_SIZE, 13.06),
; plus le surcoût OpenPGP et le reste du formulaire ; alignée sur le proxy et Apache.
upload_max_filesize = 110M
post_max_size = 110M
memory_limit = 256M
; Lecture du corps : 60 s par défaut, trop court pour 100 Mio sur une liaison lente
; (le proxy d'exemple attend 300 s).
max_input_time = 300

; Ne pas annoncer la version de PHP (en-tête X-Powered-By).
expose_php = Off

; Dates en UTC (13.07).
date.timezone = UTC

; Cache d'opcodes : le code de l'image ne change pas pendant sa vie.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
