# Site Apache de SuiviTestIntrusion (socle-2) : HTTP seul sur 8080, derrière le
# proxy inverse de l'exploitant qui termine le TLS (13.06). Les fichiers de public/
# (SPA compilée) sont servis directement ; le reste passe par Laravel (public/.htaccess).

ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<VirtualHost *:8080>
	DocumentRoot /var/www/html/public

	# Corps de 110 Mio au plus, aligné sur PHP et le proxy.
	LimitRequestBody 115343360

	<Directory /var/www/html/public>
		Options -Indexes +FollowSymLinks
		# public/.htaccess de Laravel : réécriture vers index.php, en-tête Authorization.
		AllowOverride All
		Require all granted
	</Directory>

	# En-têtes de sécurité : Laravel pose les siens sur ses réponses ; Apache ne les pose
	# que sur les fichiers qu'il sert seul (SPA compilée, Worker crypto, Swagger UI), pour
	# ne jamais les doubler. La CSP d'un Worker est celle de la réponse qui sert son
	# script (13.04) : même valeur que SecurityHeaders::spaPolicy(), vérifiée par
	# docker/tests/smoke.sh.
	<LocationMatch "^/(assets|swagger-ui)/">
		Header always set X-Content-Type-Options "nosniff"
		Header always set Referrer-Policy "no-referrer"
	</LocationMatch>

	# Ressources compilées de la SPA : leur nom porte une empreinte, elles ne changent jamais.
	<Directory /var/www/html/public/assets>
		Header set Cache-Control "public, max-age=31536000, immutable"
		# Fichiers servis sans Laravel (dont le Worker crypto) : CSP de la SPA (13.04).
		Header always set Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; require-trusted-types-for 'script'; trusted-types sti-render sti-worker dompurify default; report-uri /api/v1/csp-reports; report-to csp"
	</Directory>

	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
